name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - run: corepack enable pnpm

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: forge fmt --check

      - name: Unit Tests
        run: pnpm test

      # Uses the default public RPC. Fails unless every fork test runs and passes.
      - name: Fork Tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          pnpm test:fork | tee "$RUNNER_TEMP/fork.log"
          grep -Eq '[1-9][0-9]* tests? passed, 0 failed, 0 skipped' "$RUNNER_TEMP/fork.log" \
            || { echo "::error::Fork tests were skipped or did not run"; exit 1; }
