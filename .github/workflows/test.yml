name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - run: corepack enable pnpm

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: forge fmt --check

      - name: Unit Tests
        run: pnpm test

      # Skips unless the MAINNET_RPC_URL secret (archive node) is set
      - name: Fork Tests
        timeout-minutes: 10
        run: pnpm test:fork
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
